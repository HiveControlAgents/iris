# Copy to .github/workflows/iris.yml in your repository.
name: ÍRIS

on:
  pull_request:
    paths: ["**/*.mp4", "**/*.mov", "**/*.webm", "**/*.mkv"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true          # videos are usually stored with Git LFS
      - uses: HiveControlAgents/iris@main
        with:
          # optional: without it, the comment has only the automatic measurements
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          review-language: en
