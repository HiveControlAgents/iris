name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # no Linux, ffmpeg do apt: o download do setup-ffmpeg cai às vezes
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      # setup-ffmpeg só suporta x64; o runner macOS é arm64
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pip install Pillow pytest
      - run: pytest -q tests
      - run: pip install . && iris --help

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: >-
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=360x640:rate=30:duration=4
          -f lavfi -i sine=frequency=440:duration=4 -shortest sintetico.mp4
      - uses: ./
        with:
          videos: sintetico.mp4
          comment: "false"
