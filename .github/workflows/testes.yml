name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3
      # setup-ffmpeg só suporta x64; o runner macOS é arm64
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pip install Pillow pytest
      - run: pytest -q tests
